<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="stylesheet" href="booking.css"/>
</head>

<body>
    <div class="stepper">
        <div class="step active">
            <div class="circle">1</div>
            <p class="change-selection-link" class="step-label">Your selection</p>
        </div>

        <div class="line"></div>

        <div class="step active">
            <div class="circle">2</div>
            <p>Your details</p>
        </div>

        <div class="line"></div>

        <div class="step">
            <div class="circle">3</div>
            <p>Payment</p>
        </div>
    </div>

    <div class="details-layout">

        <div class="left-section">
         
            <div class="card">
                
                <div class="image-container">
                    <img id="room-image" class="room-image">
                </div>

                <div>
                    <h3 id="room-type-name"></h3>
                    <span id="room-building"></span> ● <span id="room-capacity"></span>
                </div>
            </div>

            <div class="card">
                <h3>Your booking details</h3>
                
                <div class="booking-date">
                    <div>
                        <p>Check-in</p>
                        <h3 id="check-in-display"></h3>
                    </div>

                    <div>
                        <p>Check-out</p>
                        <h3 id="check-out-display"></h3>
                    </div>
                </div>

                <div class="booking-date">
                    <div>
                        <p>Guests</p>
                        <h3 id="guests-display"></h3>
                    </div>

                    <div>
                        <p>Nights</p>
                        <h3 id="nights-label"></h3>
                    </div>
                </div>
                
            </div>

            <div class="card">
                <h3>Your pricing details</h3>
                <div class="price-row">
                    <p id="price-label"></p>
                    <p id="room-price"></p>
                </div>

                <div class="price-row">
                    <p>Add-ons</p>
                    <p>IDR 0</p>
                </div>

                <div class="price-row">
                    <p>Tax (10%)</p>
                    <p id="tax-amount"></p>
                </div>

                <div class="grey-line"></div>

                <div class="price-row">
                    <h3>TOTAL</h3>
                    <h3 id="grand-total"></h3>
                </div>

            </div>
        </div>

        <div class="right-section">

            <div class="card">
                <div class="input-group">
                    
                    <div class="input-row">
                        <div>
                            <h3>First name</h3>
                            <input id="first-name" type="text"/>
                        </div>

                        <div>
                            <h3>Last name</h3>
                            <input id="last-name" type="text"/>
                        </div>
                    </div>

                    <div class="input-row">
                        <div>
                            <h3>Email adress</h3>
                            <input id="email" type="text" class="input" required>
                            <p style="margin-top: 5px;">Confirmation email will be sent to this address</p>
                        </div>

                        <div>
                            <h3>Phone number</h3>
                            <input id="phone" type="text" class="input">
                        </div>
                    </div>
                
                </div>
            </div>
            
            <div style="display: flex; flex-direction: column; gap: 5px; width: 100%; margin-top: 5px;">
                <button id="confirm-btn" class="button">Confirm</button>
                <button id="cancel-btn" class="button" onclick="window.location.href='/booking/selection.html'">Cancel</button>
            </div>

        </div>

    </div>

    <script>
        const params = new URLSearchParams(window.location.search);

        const roomType   = params.get("room_type");
        const capacity   = params.get("capacity");
        const facilities = params.get("facilities");
        const checkIn    = params.get("check_in");
        const checkOut   = params.get("check_out");
        const nights     = params.get("nights");
        const totalPrice = parseFloat(params.get("total_price")) || 0;
        const imageUrl   = params.get("image_url");
        const guests     = params.get("guests");
        const building   = params.get("building");

        const tax        = totalPrice * 0.1;
        const grandTotal = totalPrice + tax;

        const formatDate = (d) => new Date(d).toLocaleDateString("en-US", {
        weekday: "short", year: "numeric", month: "short", day: "numeric"
        });

        const formatIDR = (n) => `IDR ${Math.round(n).toLocaleString("id-ID")}`;

        if (imageUrl) document.getElementById("room-image").src = "/" + imageUrl;

        document.getElementById("room-type-name").textContent    = roomType || "-";
        document.getElementById("room-capacity").textContent     = capacity ? `${capacity} Persons` : "-";
        document.getElementById("check-in-display").textContent  = checkIn ? formatDate(checkIn) : "-";
        document.getElementById("check-out-display").textContent = checkOut ? formatDate(checkOut) : "-";
        document.getElementById("guests-display").textContent    = guests ? `${guests} Guest${guests > 1 ? "s" : ""}` : "-";
        document.getElementById("nights-label").textContent      = nights ? `${nights} Night${nights > 1 ? "s" : ""}` : "-";
        document.getElementById("price-label").textContent      = nights ? `${roomType} • ${nights} Night${nights > 1 ? "s" : ""}` : "-";
        document.getElementById("room-price").textContent        = formatIDR(totalPrice);
        document.getElementById("tax-amount").textContent         = formatIDR(tax);
        document.getElementById("grand-total").textContent       = formatIDR(grandTotal);
        document.getElementById("room-building").textContent    = building ? ` ${building}` : "";

        //janlup ganti ini kalo mau pke tombol back

        //tamabahin ya sal HEHE ga paham
        const confirmElements = document.querySelectorAll(".change-selection-link");

        confirmElements.forEach(element => {
            element.onclick = () => {
                window.location.href = `/booking/selection.html?${params.toString()}`;
            };
        });

        document.getElementById("confirm-btn").onclick = async () => {
            const firstName = document.getElementById("first-name").value.trim();
            const lastName  = document.getElementById("last-name").value.trim();
            const email     = document.getElementById("email").value.trim();
            const phone     = document.getElementById("phone").value.trim();
            
            if (!firstName || !lastName || !email || !phone) {
                alert("Please fill in all fields.");
                return;
            }

            try {
                const res = await fetch("/api/bookings", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    id_room_type: params.get("id_room_type"),
                    check_in:     checkIn,
                    check_out:    checkOut,
                    num_guests:   guests,
                    total_price:  grandTotal.toFixed(2),
                    email: email,
                    first_name: document.getElementById("first-name").value.trim(),
                    last_name: document.getElementById("last-name").value.trim(),
                    phone: document.getElementById("phone").value.trim()
                })
                });

                const data = await res.json();

                if (data.id_booking) {
                    params.set("id_booking", data.id_booking);
                    params.set("grand_total", grandTotal.toFixed(2));
                    window.location.href = `/booking/payment.html?${params.toString()}`;
                } else {
                    alert("Something went wrong. Please try again.");
                }

            } catch (err) {
                console.error(err);
                alert("Failed to create booking. Please try again.");
            }
        };
    </script>

</body>
