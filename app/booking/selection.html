<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="stylesheet" href="booking.css"/>
</head>

<body>
    <div class="stepper">
        <div class="step active">
            <div class="circle">1</div>
            <p>Your selection</p>
        </div>

        <div class="line"></div>

        <div class="step">
            <div class="circle">2</div>
            <p class="confirm-btn">Your details</p>
        </div>

        <div class="line"></div>

        <div class="step">
            <div class="circle">3</div>
            <p>Payment</p>
        </div>
    </div>

    <div class="selection-layout">
        
        <div class="card-selection">
            <div class="image-container">
                <img id="room-image" class="room-image">
            </div>
            
            <div>
                <h3 id="room-type-name"></h3>
                <p id="room-capacity"></p>
                <p id="room-facilities"></p>
            </div>

            <div class="grey-line"></div>

            <div class="booking-date-selection">
                <div>
                    <p>Check-in</p>
                    <h3 id="check-in-display"></h3>
                </div>

                <div>
                    <p>Check-out</p>
                    <h3 id="check-out-display"></h3>
                </div>
                <div>
                    <p>Guests</p>
                    <h3 id="guests-display"></h3>
                </div>
            </div>

            <div class="grey-line"></div>

            <div class="price-row">
                <p id="nights-label"></p>
                <h3 id="total-price"></h3>
            </div>

            <a href="/#rooms" id="change-selection-link">Change selection?</a>

        </div>
    </div>

    <div class="button-container">    
        <button class="btn-selection confirm-btn">Confirm</button>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);

        const roomType   = params.get("room_type");
        const capacity   = params.get("capacity");
        const facilities = params.get("facilities");
        const checkIn    = params.get("check_in");
        const checkOut   = params.get("check_out");
        const nights     = params.get("nights");
        const totalPrice = params.get("total_price");
        const imageUrl   = params.get("image_url");
        const guests     = params.get("guests");

        const formatDate = (d) => new Date(d).toLocaleDateString("en-US", {
        weekday: "short", year: "numeric", month: "short", day: "numeric"
        });

        if (imageUrl) document.getElementById("room-image").src = "/" + imageUrl;

        document.getElementById("room-type-name").textContent   = roomType || "-";
        document.getElementById("room-capacity").textContent    = capacity ? `${capacity} Persons` : "-";
        document.getElementById("room-facilities").textContent  = facilities || "-";
        document.getElementById("check-in-display").textContent  = checkIn ? formatDate(checkIn) : "-";
        document.getElementById("check-out-display").textContent = checkOut ? formatDate(checkOut) : "-";
        document.getElementById("guests-display").textContent   = guests ? `${guests} Guest${guests > 1 ? "s" : ""}` : "-";
        document.getElementById("nights-label").textContent     = nights ? `${roomType} • ${nights} Night${nights > 1 ? "s" : ""}` : "-";
        document.getElementById("total-price").textContent      = totalPrice
        ? `IDR ${Number(totalPrice).toLocaleString("id-ID")}`
        : "-";

        document.getElementById("change-selection-link").href = `/?check_in=${checkIn}&check_out=${checkOut}&guests=${guests}#rooms`;

        const confirmElements = document.querySelectorAll(".confirm-btn");

        confirmElements.forEach(element => {
            element.onclick = () => {
                window.location.href = `/booking/guest-details.html?${params.toString()}`;
            };
        });
    </script>
</body>
