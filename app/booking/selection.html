<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="stylesheet" href="booking.css"/>
</head>

<body>
    <div class="stepper">
        <div class="step active">
            <div class="circle">1</div>
            <p>Your selection</p>
        </div>

        <div class="line"></div>

        <div class="step">
            <div class="circle">2</div>
            <p>Your details</p>
        </div>

        <div class="line"></div>

        <div class="step">
            <div class="circle">3</div>
            <p>Payment</p>
        </div>
    </div>

    <div class="selection-layout">
        
        <div class="card-selection">
            <div class="image-container">
                <img src="public/img1.jpg" class="room-image">
            </div>
            
            <div>
                    <p>★ ★ ★ ★ ★</p>
                    <h3>Deluxe room for 3 people</h3>
                    <p>1 King Bed • 32m²</p>
                    <p>Free Wi-Fi • Breakfast included</p>
            </div>

            <div class="grey-line"></div>

            <div class="booking-date-selection">
                <div>
                    <p>Check-in</p>
                    <h3>Fri, May 15, 2026</h3>
                    <input type="date">
                </div>

                <div>
                    <p>Check-out</p>
                    <h3>Fri, May 15, 2026</h3>
                    <input type="date">
                </div>
            </div>

            <div class="grey-line"></div>

            <div class="price-row">
                <p>Deluxe 3 Nights</p>
                <h3>IDR 11,088,000</h3>
            </div>

            <a href="/#rooms">Change selection?</a>

        </div>
    </div>

    <div class="button-container">    
        <button class="btn-selection" onclick="window.location.href='/booking/guest-details.html'">Confirm</button>
    </div>
</body>
